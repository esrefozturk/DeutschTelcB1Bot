name: Bug Report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I send a voice message, the bot responds with..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the bot with /start
        2. Send a voice message saying "..."
        3. See error / unexpected behaviour
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: "The bot should have..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Lambda logs (`aws logs tail /aws/lambda/DeutschTelcBot-prod`), Telegram screenshots, etc.
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production (AWS Lambda)
        - Local dev (polling / SQLite)
        - Both
    validations:
      required: true
