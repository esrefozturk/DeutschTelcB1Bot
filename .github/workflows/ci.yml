name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    name: Lint & import check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Import sanity check
        env:
          TELEGRAM_TOKEN: "dummy"
          GEMINI_API_KEY: "dummy"
        run: |
          python -c "import adaptive; import gemini_client; import database; import database_dynamo"
          echo "All imports OK"
