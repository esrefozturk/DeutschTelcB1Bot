name: Deploy to AWS Lambda

on:
  push:
    branches: [main]

# Only one deploy can run at a time. If a new push comes in while a deploy
# is in progress, the in-progress run is cancelled and the new one starts,
# ensuring the latest code is always what ends up deployed.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: SAM build & deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name deutsch-telc-bot-prod \
            --s3-bucket sam-artifacts-340925016843-us-east-1 \
            --region us-east-1 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              TelegramToken="${{ secrets.TELEGRAM_TOKEN }}" \
              GeminiApiKey="${{ secrets.GEMINI_API_KEY }}" \
              AdminChatId="${{ secrets.ADMIN_CHAT_ID }}" \
              Stage="prod" \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset
