line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long (handled by line-length setting)
    "E402",  # module level import not at top of file
    "F401",  # imported but unused (some are re-exported)
]

[lint.per-file-ignores]
".aws-sam/**" = ["ALL"]
